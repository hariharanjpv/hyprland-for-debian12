# hyprlock — built from source into /opt/hypr (see ~/hyprland-build/CHANGES.md)
#
# The lock image is ~/.config/hypr/lock-image, a symlink maintained by
# lockscreen.sh. (It used to live under ~/.config/swaylock; moved here when
# swaylock was purged.)

$image = $HOME/.config/hypr/lock-image
$accent = rgb(80d4d7)      # matches col.active_border in hyprland.conf
$fg     = rgb(e6e6e6)
$dim    = rgba(1a1b26cc)

general {
    hide_cursor = true
    ignore_empty_input = true   # Enter on an empty field does nothing
}

background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $dim
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
