################################################################################
#  Hyprland 0.56.2 — minimal config
#  Every option/dispatcher below verified against the built source:
#    src/config/values/ConfigValues.cpp  and  src/managers/KeybindManager.cpp
################################################################################

monitor = , preferred, auto, 1

$mod      = ALT
$terminal = foot
$launcher = fuzzel
$menu     = hypr-menu
$lock     = /opt/hypr/bin/hyprlock --config $HOME/.config/hypr/hyprlock.conf
$scripts  = $HOME/.config/hypr/scripts

# status bar — source-built Waybar 0.15 in /opt/waybar (not on the session
# PATH, unlike /opt/hypr, so spell out the path)
exec-once = /opt/waybar/bin/waybar

# notification daemon — the bar's bell module (custom/swaync) is built on it:
# swaync-client feeds the count, click opens the panel, right click toggles DND
exec-once = swaync

# night light — pkill first so a reload never leaves two running
exec-once = sh -c 'pkill -x wlsunset; exec $HOME/.config/hypr/scripts/nightlight.sh on' 

# restore the last wallpaper, if one was ever picked
exec-once = sh -c '[ -e "$HOME/.config/hypr/current-wallpaper" ] && exec swaybg -i "$HOME/.config/hypr/current-wallpaper" -m fill'

general {
    gaps_in     = 5
    gaps_out    = 10
    border_size = 2
    col.active_border   = rgba(80d4d7ee)
    col.inactive_border = rgba(3f4949aa)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity   = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size    = 8
        passes  = 3
    }

    shadow {
        enabled = true
        range   = 16
    }
}

animations {
    enabled = true
}

input {
    kb_layout    = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
}

dwindle {
    preserve_split = true
}

################################################################################
#  Workspaces -> monitors
################################################################################
# Numbered 1-5 live on the external display; named q/w/e/r on the laptop panel.
# "default:true" makes each monitor land on its own first workspace at startup.

workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1

workspace = name:q, monitor:eDP-1, default:true
workspace = name:w, monitor:eDP-1
workspace = name:e, monitor:eDP-1
workspace = name:r, monitor:eDP-1

################################################################################
#  Keybinds
################################################################################

bind = $mod,       Return, exec, $terminal
bind = $mod,       D,      exec, $launcher
bind = SUPER,      L,      exec, $lock      # explicit SUPER: $mod is ALT
bind = CTRL,   SPACE,  exec, $menu
bind = CTRL,       ESCAPE, exec, $menu power
bind = SUPER SHIFT, S,      exec, $menu capture

# Reloads the config AND restarts waybar: `hyprctl reload` does not re-run
# exec-once, so a killed bar would otherwise stay dead. See the script.
# moved off ALT+SHIFT+R, which now moves a window to workspace r
bind = CTRL SHIFT, R, exec, $scripts/reload.sh

# killactive moved off ALT+Q, which now selects workspace q
bind = CTRL, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# named workspaces on the laptop panel
bind = $mod, Q, workspace, name:q
bind = $mod, W, workspace, name:w
bind = $mod, E, workspace, name:e
bind = $mod, R, workspace, name:r

bind = $mod SHIFT, Q, movetoworkspace, name:q
bind = $mod SHIFT, W, movetoworkspace, name:w
bind = $mod SHIFT, E, movetoworkspace, name:e
bind = $mod SHIFT, R, movetoworkspace, name:r

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bind = $mod,       grave, togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Lid switch: closing with an external display attached disables the laptop
# panel, which makes Hyprland move its workspaces to the external. bindl fires
# even when the session is locked.
bindl = , switch:on:Lid Switch,  exec, $scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, $scripts/lid.sh open

bindm = $mod, mouse:272, movewindow

bindel = , XF86AudioRaiseVolume,  exec, $scripts/volume.sh --inc
bindel = , XF86AudioLowerVolume,  exec, $scripts/volume.sh --dec
bindel = , XF86AudioMute,         exec, $scripts/volume.sh --toggle
bindel = , XF86MonBrightnessUp,   exec, $scripts/brightness.sh --inc
bindel = , XF86MonBrightnessDown, exec, $scripts/brightness.sh --dec
