# fuzzel 1.12 (built by build/08-fuzzel.sh -- NOT Debian's 1.8.2).
#
# 1.8.2 rejects several keys below outright. More importantly it has NO MOUSE
# SELECTION in dmenu mode, so hypr-menu entries would be keyboard-only.
#
# Palette: dark teal Material-You. Swap the hex values for your own.
# Validate after editing:
#   man -l /opt/hypr/share/man/man5/fuzzel.ini.5

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
use-bold=yes
prompt= 
placeholder=Search
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
match-mode=fzf
terminal=foot -e
layer=overlay
lines=12
width=34
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=20
letter-spacing=0
exit-on-keyboard-focus-loss=yes

[colors]
# last byte is alpha -- dd = ~87%, so a compositor blur shows through
background=0e1415dd
text=dde4e3ff
placeholder=3f4949ff
prompt=b0ccccff
input=dde4e3ff
match=80d4d7ff
selection=324b4ccc
selection-text=9cf1f3ff
selection-match=80d4d7ff
counter=3f4949ff
border=80d4d7ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+m
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
