# fuzzel 1.8.2 (Debian 12) -- ONLY keys this version supports.
# Palette from ~/.config/waybar/colors.css (dark teal Material-You).

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt= 
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
layer=overlay
lines=12
width=34
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=20
letter-spacing=0
exit-on-keyboard-focus-loss=yes

[colors]
# last byte is alpha -- dd = ~87%, so Hyprland's blur shows through
background=0e1415dd
text=dde4e3ff
match=80d4d7ff
selection=324b4ccc
selection-text=9cf1f3ff
selection-match=80d4d7ff
border=80d4d7ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+m
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
